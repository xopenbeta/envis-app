<!doctype html>
<!-- 移动端是终端客户端，整个应用恒定深色（见 src/mobile/App.tsx）。
     主题类直接写在 html 上，避免启动瞬间的浅色闪烁。 -->
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/envis.svg" />
    <link rel="icon" type="image/png" href="/envis.png" sizes="192x192" />
    <!-- viewport-fit=cover 才能让 env(safe-area-inset-*) 生效（刘海屏 / 手势条） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#171717" />
    <title>Envis</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-mobile.tsx"></script>
  </body>
</html>
