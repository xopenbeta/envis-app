name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch to build (must be enterprise)'
        required: false
        default: 'enterprise'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: enterprise
          submodules: recursive
          token: ${{ secrets.ENVIS_CORE_ACCESS_TOKEN }}

      - name: Verify submodule checkout
        shell: bash
        run: |
          if [ ! -f "src-tauri/crates/envis-core/Cargo.toml" ]; then
            echo "envis-core submodule is missing."
            echo "Please configure ENVIS_CORE_ACCESS_TOKEN with read access to private envis-core repository."
            exit 1
          fi
          git submodule status --recursive

      - name: Force envis-core to latest enterprise
        shell: bash
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --remote src-tauri/crates/envis-core
          git -C src-tauri/crates/envis-core fetch origin enterprise
          git -C src-tauri/crates/envis-core checkout enterprise || git -C src-tauri/crates/envis-core checkout -b enterprise --track origin/enterprise
          git -C src-tauri/crates/envis-core pull --rebase --autostash origin enterprise
          git -C src-tauri/crates/envis-core rev-parse --short HEAD

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        # You can remove libayatana-appindicator3-dev if you don't use the system tray feature.
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install

      - name: Extract Release Notes
        id: release_notes
        shell: bash
        run: |
          NOTES=$(node scripts/extract-changelog.js)
          delimiter="EOF_$(date +%s%N)"
          echo "NOTES<<${delimiter}" >> "$GITHUB_OUTPUT"
          echo "${NOTES}" >> "$GITHUB_OUTPUT"
          echo "${delimiter}" >> "$GITHUB_OUTPUT"

      - name: Add Rust targets for macOS
        if: matrix.platform == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__ # the action automatically replaces __VERSION__ with the app version
          releaseName: 'Envis v__VERSION__'
          releaseBody: ${{ steps.release_notes.outputs.NOTES }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'macos-latest' && '--target universal-apple-darwin' || '' }}